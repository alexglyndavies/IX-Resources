version: 2

build:
  os: ubuntu-24.04

  tools:
    python: "3.12"

  jobs:
    pre_build:
      - python code/generate_talks.py
      - python code/generate_programming.py

mkdocs:
  configuration: mkdocs.yml
  fail_on_warning: false

python:
  install:
    - method: uv
      command: sync
      path: code
